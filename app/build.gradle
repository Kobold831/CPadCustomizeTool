plugins {
    alias libs.plugins.agp.app
}

android {
    namespace = 'com.saradabar.cpadcustomizetool'
    //noinspection GradleDependency
    compileSdk = 36

    defaultConfig {
        minSdk = 22
        //noinspection ExpiredTargetSdkVersion
        targetSdk = 22
        versionCode = 290
        versionName = "2.9.0"
        resourceConfigurations += ["ja"]
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }

    signingConfigs {
        configureEach {
            enableV1Signing = true
            enableV2Signing = false
            enableV3Signing = false
        }
        android {
            storeFile file('android.jks')
            storePassword 'android'
            keyAlias 'android'
            keyPassword 'android'
        }
    }

    buildTypes {
        configureEach {
            signingConfig = signingConfigs.android
        }
        release {
            minifyEnabled = true
            shrinkResources = true
        }
    }

    androidResources {
        noCompress.add("der")
        additionalParameters '--preferred-density', 'hdpi',
                '--exclude-configs', 'v31',
                '--exclude-configs', 'ldrtl',
                '--exclude-configs', 'land',
                '--exclude-configs', 'port'
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    lint {
        checkReleaseBuilds = false
        disable 'ProtectedPermissions', 'ExportedService', 'SetJavaScriptEnabled'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    // Custom Libraries
    compileOnly project(":ext")
    implementation project(":svc")
    compileOnly project(":hidden-api")
    // AndroidX
    implementation libs.preference
    // Google Material You
    implementation libs.material
    // Dhizuku
    implementation libs.dhizuku.api
}

tasks.withType(JavaCompile).configureEach {
    //options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}
